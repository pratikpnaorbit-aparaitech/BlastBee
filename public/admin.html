<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlastBee 🐝 SuperAdmin Console &bull; Developed by Aparaitech Software</title>
  <meta name="description" content="BlastBee SuperAdmin portal for payment approvals, customer management, plan pricing editor, server quotas, and multi-SMTP fleets. Developed by Aparaitech Software." />
  
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/toast.css" />

  <style>
    .admin-layout {
      min-height: 100vh;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
    }
    .admin-header {
      height: 64px;
      background: #0a1128;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      color: #fff;
    }
    .admin-content {
      flex: 1;
      padding: 28px;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
    }
    .action-btn-group {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    .proof-thumbnail {
      width: 52px;
      height: 52px;
      object-fit: cover;
      border-radius: 6px;
      border: 1.5px solid #cbd5e1;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      background: #fff;
    }
    .proof-thumbnail:hover {
      transform: scale(1.15);
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    }
    .badge-pending {
      background: #fef3c7;
      color: #b45309;
      border: 1px solid #fde68a;
      font-weight: 700;
    }
    .badge-approved {
      background: #dcfce7;
      color: #15803d;
      border: 1px solid #bbf7d0;
      font-weight: 700;
    }
    .badge-rejected {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      font-weight: 700;
    }

    /* Premium Filter Pills & Controls */
    .filter-card-bar {
      margin: 16px 0 16px 0;
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    }
    .filter-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      border: 1.5px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      transition: all 0.15s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      user-select: none;
      line-height: 1.2;
    }
    .filter-pill-btn:hover {
      background: #f8fafc;
      border-color: #94a3b8;
      color: #0f172a;
      transform: translateY(-1px);
    }
    .filter-pill-btn.active {
      background: #2563eb !important;
      border-color: #1d4ed8 !important;
      color: #ffffff !important;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35) !important;
    }
    .filter-pill-btn.active.pill-green {
      background: #059669 !important;
      border-color: #047857 !important;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.35) !important;
    }
    .filter-pill-btn.active.pill-purple {
      background: #7c3aed !important;
      border-color: #6d28d9 !important;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.35) !important;
    }
    .filter-pill-btn.active.pill-amber {
      background: #d97706 !important;
      border-color: #b45309 !important;
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.35) !important;
    }
    .filter-pill-btn.active.pill-red {
      background: #dc2626 !important;
      border-color: #b91c1c !important;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.35) !important;
    }
    .pill-count {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 99px;
      font-size: 0.72rem;
      font-weight: 800;
      background: #f1f5f9;
      color: #475569;
      margin-left: 4px;
      border: 1px solid #e2e8f0;
      transition: all 0.15s ease;
    }
    .filter-pill-btn.active .pill-count {
      background: rgba(255, 255, 255, 0.28) !important;
      color: #ffffff !important;
      border-color: transparent !important;
    }
    .search-box-input {
      padding-left: 38px;
      padding-right: 32px;
      height: 40px;
      border-radius: 8px;
      font-size: 0.86rem;
      font-weight: 500;
      width: 100%;
      border: 1.5px solid #cbd5e1;
      background: #f8fafc;
      color: #0f172a;
      transition: all 0.15s ease;
    }
    .search-box-input:focus {
      background: #ffffff;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      outline: none;
    }
  </style>
</head>
<body class="app-body">
  <div class="admin-layout">
    <!-- Admin Header -->
    <header class="admin-header">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 38px; height: 38px; background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); border-radius: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4); flex-shrink: 0;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 5C8.5 2.5 5 2.5 3.5 4.5C2 6.5 3 10 5.5 11C7.5 11.8 9.5 9.5 10 7.5V5Z" fill="#38bdf8" opacity="0.9"/>
            <path d="M14 5C15.5 2.5 19 2.5 20.5 4.5C22 6.5 21 10 18.5 11C16.5 11.8 14.5 9.5 14 7.5V5Z" fill="#38bdf8" opacity="0.95"/>
            <ellipse cx="12" cy="13" rx="4.8" ry="6.5" fill="#0f172a"/>
            <path d="M7.6 11H16.4" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M7.4 13.5H16.6" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
            <path d="M8.2 16H15.8" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
            <circle cx="12" cy="7" r="2.8" fill="#ffffff"/>
            <path d="M10.8 5L9 2.8" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M13.2 5L15 2.8" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M12 19.5V22" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div style="font-size: 1.3rem; font-weight: 800; letter-spacing: -0.3px; color: #ffffff;">
          Blast<span style="color: #fbbf24;">Bee</span> <span class="badge badge-primary" style="font-size: 0.68rem; margin-left: 6px; vertical-align: middle;">ADMIN</span>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 14px;">
        <a href="/app" class="btn btn-outline btn-xs" style="color: #93c5fd; border-color: rgba(255,255,255,0.2);">
          <span>Open Customer App &nearr;</span>
        </a>
        <div id="adminUserPill" style="display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.08); padding: 4px 10px; border-radius: 99px;">
          <span>👨‍💼</span>
          <span style="font-size: 0.8rem; font-weight: 600;" id="adminUserName">Super Administrator</span>
          <span class="badge badge-primary" style="font-size: 0.65rem;">SUPERADMIN</span>
        </div>
        <button class="btn btn-secondary btn-xs" onclick="AdminPortal.logout()">
          <span>Log Out</span>
        </button>
      </div>
    </header>

    <!-- Main Admin Container -->
    <main class="admin-content" id="adminContainer">
      <div class="view-loading">
        <div class="spinner"></div>
        <p>Loading Dedicated SuperAdmin Dashboard...</p>
      </div>
    </main>
  </div>

  <!-- Global Modal Container -->
  <div id="modalContainer" class="modal-overlay" style="display: none;">
    <div class="modal-card" id="modalCard"></div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script>
    const AdminPortal = {
      state: {
        customers: [],
        subscription: null,
        plans: [],
        fleet: [],
        pendingPayments: [],
        paymentHistory: [],
        allUsers: [],
        activeTab: 'approvals',
        currentUser: null,
        customerSearch: '',
        customerFilter: 'all',
        userSearch: '',
        userFilter: 'all'
      },

      async init() {
        const modalOverlay = document.getElementById('modalContainer');
        if (modalOverlay) {
          modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) AdminPortal.closeModal();
          });
        }
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') AdminPortal.closeModal();
        });

        await this.checkAuth();
        if (!this.state.currentUser || this.state.currentUser.role !== 'superadmin') {
          this.renderLoginGate();
          return;
        }

        await this.loadData();
        // If no pending payments, default to customers tab
        if (this.state.pendingPayments.length === 0 && this.state.activeTab === 'approvals') {
          this.state.activeTab = 'customers';
        }
        this.renderDashboard();
      },

      async checkAuth() {
        try {
          const res = await api.getMe();
          if (res.authenticated && res.user) {
            this.state.currentUser = res.user;
            const nameEl = document.getElementById('adminUserName');
            if (nameEl) nameEl.textContent = res.user.full_name || res.user.username;
          } else {
            this.state.currentUser = null;
          }
        } catch (e) {
          this.state.currentUser = null;
        }
      },

      async loadData() {
        try {
          const [custRes, subRes, plansRes, fleetRes, payRes, usersRes] = await Promise.all([
            api.getCustomers().catch(() => ({ customers: [] })),
            api.getSubscription().catch(() => ({ subscription: null })),
            api.getSubscriptionPlans().catch(() => ({ plans: [] })),
            api.getServerFleet().catch(() => ({ fleet: [] })),
            api.getAdminPayments().catch(() => ({ pending: [], history: [] })),
            api.getAdminUsers().catch(() => ({ users: [] }))
          ]);

          this.state.customers = custRes.customers || [];
          this.state.subscription = subRes.subscription;
          this.state.plans = plansRes.plans || [];
          this.state.fleet = fleetRes.fleet || [];
          this.state.pendingPayments = payRes.pending || [];
          this.state.paymentHistory = payRes.history || [];
          this.state.allUsers = usersRes.users || [];
        } catch (err) {
          console.error('Data load error:', err);
          this.showToast('Failed to load portal data: ' + err.message, 'error');
        }
      },

      renderLoginGate() {
        const container = document.getElementById('adminContainer');
        container.innerHTML = `
          <div style="max-width: 440px; margin: 40px auto; padding: 20px;">
            <div class="card" style="box-shadow: var(--shadow-xl); border: 1px solid var(--border-light); border-radius: var(--radius-lg); overflow: hidden;">
              <div style="background: linear-gradient(135deg, #0b1329 0%, #1e3a8a 100%); padding: 32px 24px; text-align: center; color: #fff;">
                <div style="font-size: 2.2rem; margin-bottom: 8px;">🛡️</div>
                <h2 style="font-size: 1.35rem; font-weight: 700; color: #fff; margin-bottom: 4px;">SuperAdmin Access Only</h2>
                <p style="font-size: 0.82rem; color: #93c5fd;">Sign in to access the Dedicated Administrator Dashboard</p>
              </div>

              <div style="padding: 24px;">
                <form onsubmit="AdminPortal.handleLogin(event)">
                  <div class="form-group" style="margin-bottom: 14px;">
                    <label class="form-label" style="font-weight: 600;">Email</label>
                    <input type="email" id="adminLoginEmail" class="form-input" value="admin@aparaitech.org" required />
                  </div>
                  <div class="form-group" style="margin-bottom: 20px;">
                    <label class="form-label" style="font-weight: 600;">Password</label>
                    <input type="password" id="adminLoginPass" class="form-input" value="admin123" required />
                  </div>
                  <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 10px;">
                    <span>Log In to Admin Dashboard</span>
                  </button>
                </form>

                <div style="margin-top: 18px; padding: 12px; background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 6px; font-size: 0.78rem; color: #0369a1;">
                  <strong>👑 Default Credentials:</strong><br>
                  Email: <code>admin@aparaitech.org</code><br>
                  Password: <code>admin123</code>
                </div>
              </div>
            </div>
          </div>
        `;
      },

      async handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('adminLoginEmail').value.trim();
        const password = document.getElementById('adminLoginPass').value;

        try {
          const res = await api.login({ email, password });
          if (res.user && res.user.role === 'superadmin') {
            localStorage.setItem('aparaitech_auth_token', res.token);
            this.state.currentUser = res.user;
            this.showToast('SuperAdmin authenticated!', 'success');
            await this.loadData();
            this.renderDashboard();
          } else {
            this.showToast('Access denied: Requires SuperAdmin privileges.', 'error');
          }
        } catch (err) {
          this.showToast(err.message, 'error');
        }
      },

      async logout() {
        try { await api.logout(); } catch (e) {}
        localStorage.removeItem('aparaitech_auth_token');
        window.location.href = '/';
      },

      renderDashboard() {
        const customers = this.state.customers;
        const pending = this.state.pendingPayments;
        const activeSubscribers = customers.filter(c => c.status === 'active');
        const fleet = this.state.fleet;

        const container = document.getElementById('adminContainer');
        container.innerHTML = `
          <!-- Header KPI Stats -->
          <div class="stats-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px;">
            <div class="stat-card" style="border-top: 4px solid ${pending.length > 0 ? '#ef4444' : '#10b981'}; background: #fff; padding: 16px; border-radius: 8px; box-shadow: var(--shadow-sm);">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 0.78rem; font-weight: 700; color: #475569; text-transform: uppercase;">Payment Approvals</span>
                <span style="font-size: 1.2rem;">${pending.length > 0 ? '🔔' : '✅'}</span>
              </div>
              <div style="font-size: 1.8rem; font-weight: 800; color: ${pending.length > 0 ? '#dc2626' : '#059669'}; margin: 4px 0;">
                ${pending.length}
              </div>
              <div style="font-size: 0.74rem; color: var(--text-muted);">
                ${pending.length > 0 ? 'Action required: screenshots awaiting review' : 'All UPI proofs reviewed'}
              </div>
            </div>

            <div class="stat-card" style="border-top: 4px solid #2563eb; background: #fff; padding: 16px; border-radius: 8px; box-shadow: var(--shadow-sm);">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 0.78rem; font-weight: 700; color: #475569; text-transform: uppercase;">Customer Accounts</span>
                <span style="font-size: 1.2rem;">👥</span>
              </div>
              <div style="font-size: 1.8rem; font-weight: 800; color: #1e293b; margin: 4px 0;">${customers.length}</div>
              <div style="font-size: 0.74rem; color: var(--text-muted);">Registered customer workspaces</div>
            </div>

            <div class="stat-card" style="border-top: 4px solid #059669; background: #fff; padding: 16px; border-radius: 8px; box-shadow: var(--shadow-sm);">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 0.78rem; font-weight: 700; color: #475569; text-transform: uppercase;">Active Paid Subscriptions</span>
                <span style="font-size: 1.2rem;">👑</span>
              </div>
              <div style="font-size: 1.8rem; font-weight: 800; color: #059669; margin: 4px 0;">${activeSubscribers.length}</div>
              <div style="font-size: 0.74rem; color: var(--text-muted);">Upgraded multi-server licenses</div>
            </div>

            <div class="stat-card" style="border-top: 4px solid #7c3aed; background: #fff; padding: 16px; border-radius: 8px; box-shadow: var(--shadow-sm);">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 0.78rem; font-weight: 700; color: #475569; text-transform: uppercase;">Platform Senders</span>
                <span style="font-size: 1.2rem;">🖥️</span>
              </div>
              <div style="font-size: 1.8rem; font-weight: 800; color: #7c3aed; margin: 4px 0;">${fleet.length}</div>
              <div style="font-size: 0.74rem; color: var(--text-muted);">${fleet.filter(f => f.is_active).length} active delivery senders</div>
            </div>
          </div>

          <!-- Tab Navigation -->
          <div class="tabs-nav" style="display: flex; gap: 8px; border-bottom: 2px solid var(--border-light); margin-bottom: 20px; flex-wrap: wrap;">
            <button class="tab-btn ${this.state.activeTab === 'approvals' ? 'active' : ''}" onclick="AdminPortal.switchTab('approvals')">
              <span>💰 Payment Proofs &amp; Approvals</span>
              ${pending.length > 0 ? `<span class="badge" style="background: #dc2626; color: #fff; margin-left: 6px; font-weight: 800;">${pending.length} PENDING</span>` : ''}
            </button>
            <button class="tab-btn ${this.state.activeTab === 'customers' ? 'active' : ''}" onclick="AdminPortal.switchTab('customers')">
              <span>👥 Customers &amp; Server Quotas ("How Much Server You Gave")</span>
            </button>
            <button class="tab-btn ${this.state.activeTab === 'users' ? 'active' : ''}" onclick="AdminPortal.switchTab('users')">
              <span>🛡️ All Users (${this.state.allUsers.length})</span>
            </button>
            <button class="tab-btn ${this.state.activeTab === 'plans' ? 'active' : ''}" onclick="AdminPortal.switchTab('plans')">
              <span>💎 Plan Pricing &amp; Quotas Editor</span>
            </button>
            <button class="tab-btn ${this.state.activeTab === 'fleet' ? 'active' : ''}" onclick="AdminPortal.switchTab('fleet')">
              <span>🖥️ Global SMTP Fleet</span>
            </button>
          </div>

          <!-- Tab Content -->
          <div id="tabContentArea">
            ${this.renderActiveTab()}
          </div>
        `;
      },

      switchTab(tab) {
        this.state.activeTab = tab;
        document.querySelectorAll('.tabs-nav .tab-btn').forEach(b => b.classList.remove('active'));
        const btn = document.querySelector(`.tabs-nav .tab-btn[onclick*="${tab}"]`);
        if (btn) btn.classList.add('active');
        document.getElementById('tabContentArea').innerHTML = this.renderActiveTab();
      },

      renderActiveTab() {
        if (this.state.activeTab === 'approvals') {
          return this.renderApprovalsTab();
        } else if (this.state.activeTab === 'customers') {
          return this.renderCustomersTab();
        } else if (this.state.activeTab === 'users') {
          return this.renderUsersTab();
        } else if (this.state.activeTab === 'plans') {
          return this.renderPlansTab();
        } else {
          return this.renderFleetTab();
        }
      },

      // TAB 1: Payment Approvals & Verification
      renderApprovalsTab() {
        const pending = this.state.pendingPayments;
        const history = this.state.paymentHistory.filter(p => p.status !== 'pending');

        return `
          <!-- Pending Approvals Section -->
          <div class="card" style="margin-bottom: 24px; border-left: 4px solid #f59e0b;">
            <div class="card-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
              <div>
                <h3 class="card-title" style="display: flex; align-items: center; gap: 8px;">
                  <span>🔔 Pending UPI Payment Proofs</span>
                  <span class="badge ${pending.length > 0 ? 'badge-danger' : 'badge-success'}">${pending.length} Awaiting Approval</span>
                </h3>
                <p style="font-size: 0.82rem; color: var(--text-muted); margin-top: 2px;">
                  Verify the customer's payment screenshot receipt and 12-digit UTR number against your UPI merchant statement (<code>8261840199-3@ibl</code>). Click "Approve &amp; Release Access" to unlock their multi-server quota instantly.
                </p>
              </div>
              <button class="btn btn-secondary btn-sm" onclick="AdminPortal.refreshData()">🔄 Refresh</button>
            </div>

            <div class="table-container" style="margin-top: 14px;">
              <table class="table" style="width: 100%;">
                <thead>
                  <tr>
                    <th>Customer Details</th>
                    <th>Requested Plan &amp; Quota</th>
                    <th>Payable Amount</th>
                    <th>UTR / Reference No.</th>
                    <th>Payment Screenshot Proof</th>
                    <th>Submitted At</th>
                    <th style="text-align: right;">Approval Actions</th>
                  </tr>
                </thead>
                <tbody>
                  ${pending.length === 0 ? `
                    <tr>
                      <td colspan="7" style="text-align: center; padding: 36px 16px; color: var(--text-muted);">
                        <div style="font-size: 2rem; margin-bottom: 8px;">🎉</div>
                        <div style="font-weight: 700; color: #0f172a; font-size: 1rem;">No Pending Payment Approvals</div>
                        <p style="font-size: 0.82rem; margin-top: 4px;">When a customer submits their UPI screenshot receipt from the portal, it will appear here for verification.</p>
                      </td>
                    </tr>
                  ` : pending.map(p => `
                    <tr>
                      <td>
                        <div style="font-weight: 700; color: var(--text-primary);">${p.full_name || p.username}</div>
                        <div style="font-size: 0.76rem; color: var(--text-muted);">${p.company || 'Customer'}</div>
                        <div style="font-size: 0.74rem;"><code>${p.email}</code></div>
                        ${p.phone ? `<div style="font-size: 0.72rem; color: var(--text-light);">📞 ${p.phone}</div>` : ''}
                      </td>
                      <td>
                        <div style="font-weight: 700; color: #1e40af;">${p.plan_name || p.plan_id.toUpperCase()}</div>
                        <span class="badge badge-primary" style="font-size: 0.7rem; margin-top: 4px;">
                          🖥️ Unlocks ${p.plan_servers || 2} Dedicated Servers
                        </span>
                      </td>
                      <td>
                        <div style="font-size: 1.15rem; font-weight: 800; color: #059669;">

                              <button type="button" class="btn btn-ghost btn-xs" style="color: #2563eb; font-weight: 600;"
                                onclick="AdminPortal.viewScreenshot('${p.screenshot_url}', '${p.utr_number}', '${p.full_name.replace(/'/g, "\\'")}')">
                                🔍 View Proof
                              </button>
                            </div>
                          </div>

                          <span style="font-size: 0.76rem; color: #dc2626; font-weight: 600;">⚠️ No screenshot</span>
                        `}
                      </td>

                        ${new Date(p.created_at).toLocaleString()}

                          </button>
                          <button class="btn btn-outline btn-sm" style="color: #dc2626; border-color: #fca5a5;"
                            onclick="AdminPortal.rejectPayment(${p.id}, '${p.full_name.replace(/'/g, "\\'")}')">
                            ✗ Reject
                          </button>
                        </div>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>

          <!-- Historical Payments Section -->
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">📜 Payment Verification History</h3>
              <p style="font-size: 0.82rem; color: var(--text-muted); margin-top: 2px;">
                Audit log of previously approved and rejected UPI subscription payments
              </p>
            </div>

            <div class="table-container" style="margin-top: 14px;">
              <table class="table" style="width: 100%;">
                <thead>
                  <tr>
                    <th>Customer</th>
                    <th>Plan</th>
                    <th>Amount</th>
                    <th>UTR</th>

                    <th>Status</th>
                    <th>Reviewed By / Notes</th>
                    <th>Date</th>
                  </tr>
                </thead>
                <tbody>
                  ${history.length === 0 ? `
                    <tr><td colspan="8" style="text-align:center; padding: 24px; color: var(--text-muted);">No payment history records found.</td></tr>
                  ` : history.map(h => `
                    <tr>
                      <td>
                        <div style="font-weight: 600;">${h.full_name || h.username}</div>
                        <div style="font-size: 0.74rem; color: var(--text-muted);">${h.email}</div>
                      </td>
                      <td><strong>${h.plan_name || h.plan_id}</strong></td>
                      <td><strong>₹${Number(h.amount).toLocaleString('en-IN')}</strong></td>

                      <td>
                        ${h.screenshot_url ? `
                          <a href="${h.screenshot_url}" target="_blank" style="color: #2563eb; font-size: 0.76rem; font-weight: 600;">

                        <div>Admin: <strong>${h.reviewed_by_name || 'System Admin'}</strong></div>

      },

      // Filter Helpers for Customers
      getFilteredCustomers() {
        const query = (this.state.customerSearch || '').trim().toLowerCase();
        const filter = this.state.customerFilter || 'all';

        return this.state.customers.filter(c => {
          if (filter === 'logged_in' && !c.has_logged_in) return false;
          if (filter === 'active_paid' && c.status !== 'active') return false;
          if (filter === 'trial' && c.status !== 'trial') return false;

          if (query) {
            const matchName = (c.full_name || '').toLowerCase().includes(query);
            const matchUser = (c.username || '').toLowerCase().includes(query);
            const matchEmail = (c.email || '').toLowerCase().includes(query);
            const matchCompany = (c.company || '').toLowerCase().includes(query);
            const matchPhone = (c.phone || '').toLowerCase().includes(query);
            const matchPlan = (c.plan_name || '').toLowerCase().includes(query);
            const matchStatus = (c.status || '').toLowerCase().includes(query);
            if (!matchName && !matchUser && !matchEmail && !matchCompany && !matchPhone && !matchPlan && !matchStatus) {
              return false;
            }
          }
          return true;
        });
      },

      filterCustomers(query) {
        this.state.customerSearch = query;
        const tbody = document.getElementById('customerTableBody');
        const countBadge = document.getElementById('customerCountBadge');
        const clearBtn = document.getElementById('customerClearSearchBtn');
        if (clearBtn) {
          clearBtn.style.display = query ? 'flex' : 'none';
        }
        if (tbody) {
          const filtered = this.getFilteredCustomers();
          tbody.innerHTML = this.renderCustomerRows(filtered);
          if (countBadge) countBadge.textContent = `${filtered.length} of ${this.state.customers.length}`;
        }
      },

      setCustomerFilter(filter) {
        this.state.customerFilter = filter;
        document.getElementById('tabContentArea').innerHTML = this.renderActiveTab();
      },

      clearCustomerSearch() {
        this.state.customerSearch = '';
        const input = document.getElementById('customerSearchInput');
        if (input) input.value = '';
        this.filterCustomers('');
      },

      // TAB 2: Customer Accounts & Server Quota Fleet
      renderCustomersTab() {
        const customers = this.state.customers;
        const filtered = this.getFilteredCustomers();
        const loggedInCount = customers.filter(c => c.has_logged_in).length;
        const activePaidCount = customers.filter(c => c.status === 'active').length;
        const trialCount = customers.filter(c => c.status === 'trial').length;

        return `
          <div class="card">
            <div class="card-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
              <div>
                <h3 class="card-title" style="display: flex; align-items: center; gap: 8px;">
                  <span>👥 Customer Accounts &amp; Server Allocation</span>
                  <span class="badge badge-primary" id="customerCountBadge">${filtered.length} of ${customers.length}</span>
                </h3>
                <p style="font-size: 0.82rem; color: var(--text-muted); margin-top: 2px;">
                  Manage registered customer workspaces, verify active subscription tiers, allocate multi-SMTP server quotas, or extend 7-day trials.
                </p>
              </div>
              <button class="btn btn-secondary btn-sm" onclick="AdminPortal.refreshData()">🔄 Refresh</button>
            </div>

            <!-- Search Bar & Filter Controls -->
            <div class="filter-card-bar">
              <!-- Live Search Input -->
              <div style="position: relative; flex: 1; min-width: 280px; max-width: 480px;">
                <span style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 1rem; color: #64748b; pointer-events: none;">🔍</span>
                <input type="text" id="customerSearchInput" value="${this.state.customerSearch}"
                  placeholder="Search customers by name, email, company, phone, plan..." 
                  class="search-box-input" 
                  oninput="AdminPortal.filterCustomers(this.value)" />
                <button id="customerClearSearchBtn" onclick="AdminPortal.clearCustomerSearch()" 
                  style="display: ${this.state.customerSearch ? 'flex' : 'none'}; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: #e2e8f0; border: none; cursor: pointer; color: #475569; font-size: 0.8rem; width: 22px; height: 22px; border-radius: 50%; align-items: center; justify-content: center; font-weight: 800;" title="Clear search">✕</button>
              </div>

              <!-- Quick Filter Pills -->
              <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                <button class="filter-pill-btn ${this.state.customerFilter === 'all' ? 'active' : ''}" 
                  onclick="AdminPortal.setCustomerFilter('all')">
                  <span>🌟 All</span>
                  <span class="pill-count">${customers.length}</span>
                </button>
                <button class="filter-pill-btn pill-green ${this.state.customerFilter === 'logged_in' ? 'active' : ''}" 
                  onclick="AdminPortal.setCustomerFilter('logged_in')" title="Show only customers who have logged in">
                  <span>🟢 Logged In Only</span>
                  <span class="pill-count">${loggedInCount}</span>
                </button>
                <button class="filter-pill-btn pill-purple ${this.state.customerFilter === 'active_paid' ? 'active' : ''}" 
                  onclick="AdminPortal.setCustomerFilter('active_paid')">
                  <span>👑 Active Paid</span>
                  <span class="pill-count">${activePaidCount}</span>
                </button>
                <button class="filter-pill-btn pill-amber ${this.state.customerFilter === 'trial' ? 'active' : ''}" 
                  onclick="AdminPortal.setCustomerFilter('trial')">
                  <span>⏳ Free Trial</span>
                  <span class="pill-count">${trialCount}</span>
                </button>
              </div>
            </div>

            <div class="table-container" style="margin-top: 4px;">
              <table class="table" style="width: 100%;">
                <thead>
                  <tr>
                    <th style="min-width: 180px;">Customer / Organization</th>
                    <th style="min-width: 170px;">Email / Phone</th>
                    <th style="min-width: 220px; background: #f0fdf4; color: #166534; border-left: 2px solid #86efac; border-right: 1px solid #bbf7d0;">
                      👑 Active Subscription
                    </th>
                    <th style="min-width: 140px;">Validity &amp; Expiry</th>
                    <th style="min-width: 160px;">Servers Given (Quota)</th>
                    <th style="min-width: 130px;">Login Status</th>
                    <th style="text-align: right; min-width: 200px;">Admin Controls</th>
                  </tr>
                </thead>
                <tbody id="customerTableBody">
                  ${this.renderCustomerRows(filtered)}
                </tbody>
              </table>
            </div>
          </div>
        `;
      },

      renderCustomerRows(customers) {
        if (!customers || customers.length === 0) {
          return `
            <tr>
              <td colspan="7" style="text-align:center; padding: 40px 16px; color: var(--text-muted);">
                <div style="font-size: 2rem; margin-bottom: 8px;">🔍</div>
                <div style="font-weight: 700; color: #1e293b; font-size: 1rem;">No matching customer accounts found</div>
                <p style="font-size: 0.82rem; margin-top: 4px;">Try adjusting your search keywords or switching the filter button above.</p>
                ${this.state.customerSearch ? `
                  <button class="btn btn-secondary btn-xs" style="margin-top: 10px;" onclick="AdminPortal.clearCustomerSearch()">Clear Search</button>
                ` : ''}
              </td>
            </tr>
          `;
        }

        return customers.map(c => `
          <tr>
            <!-- 1. Customer & Company -->

              <div style="display: flex; align-items: center; gap: 10px;">

                  ${c.avatar || '🎓'}
                </div>
                <div>
                  <div style="font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 6px;">

                  </div>
                  <div style="font-size: 0.76rem; color: #475569; font-weight: 500;">${c.company || 'Direct Recruiter'}</div>
                  <div style="font-size: 0.7rem; color: var(--text-muted);">@${c.username}</div>
                </div>
              </div>
            </td>

            <!-- 2. Email / Phone -->
            <td>
              <div style="font-family: var(--font-mono, monospace); font-size: 0.82rem; font-weight: 600; color: #1e293b;">
                ${c.email}
              </div>
              <div style="font-size: 0.74rem; color: #64748b; margin-top: 2px;">
                ${c.phone ? `📞 ${c.phone}` : '<span style="color:#94a3b8;">No phone recorded</span>'}
              </div>
            </td>

            <!-- 3. DEDICATED COLUMN: ACTIVE SUBSCRIPTION -->
            <td style="background: rgba(240, 253, 244, 0.4); border-left: 2px solid #86efac; border-right: 1px solid #dcfce7;">
              ${c.status === 'active' ? `
                <div style="display: flex; flex-direction: column; gap: 4px;">
                  <span class="badge badge-success" style="font-size: 0.82rem; padding: 5px 10px; font-weight: 800; display: inline-flex; align-items: center; gap: 5px; width: fit-content; box-shadow: 0 1px 2px rgba(16, 185, 129, 0.2);">
                    👑 ${c.plan_name || 'Active Paid Tier'}
                  </span>
                  <div style="font-size: 0.72rem; color: #15803d; font-weight: 600; display: flex; align-items: center; gap: 4px;">
                    <span>✓</span> Multi-Server Fleet Unlocked
                  </div>
                </div>
              ` : c.status === 'trial' ? `
                <div style="display: flex; flex-direction: column; gap: 4px;">
                  ${c.is_trial_expired ? `
                    <span class="badge badge-danger" style="font-size: 0.8rem; padding: 5px 10px; font-weight: 800; width: fit-content;">
                      ⚠️ Free Trial Expired
                    </span>
                    <span style="font-size: 0.72rem; color: #dc2626;">Upgrade needed to unlock servers</span>
                  ` : `
                    <span class="badge badge-warning" style="font-size: 0.8rem; padding: 5px 10px; font-weight: 800; display: inline-flex; align-items: center; gap: 5px; width: fit-content;">
                      ⏳ 7-Day Free Trial (${c.days_remaining}d Left)
                    </span>
                    <span style="font-size: 0.72rem; color: #b45309; font-weight: 600;">Active 1-Server Evaluation</span>
                  `}
                </div>
              ` : `
                <span class="badge badge-secondary" style="font-size: 0.78rem;">${(c.status || 'inactive').toUpperCase()}</span>
              `}

              ${c.pending_payment ? `
                <div style="margin-top: 6px; padding: 4px 8px; background: #fef3c7; border: 1px solid #fde68a; border-radius: 4px; font-size: 0.72rem; color: #92400e; display: flex; align-items: center; justify-content: space-between; gap: 6px;">
                  <span>🔔 <strong>Payment Proof Under Review</strong> (₹${c.pending_payment.amount})</span>
                  <button class="btn btn-xs" style="background:#b45309; color:#fff; padding: 2px 6px; font-size: 0.68rem; border-radius: 4px;" onclick="AdminPortal.switchTab('approvals')">Review &rarr;</button>
                </div>
              ` : ''}
            </td>

            <!-- 4. Validity & Expiry -->
            <td>
              ${c.status === 'trial' ? `
                <div style="font-size: 0.82rem; font-weight: 700; color: ${c.is_trial_expired ? '#dc2626' : '#b45309'};">

                <div style="font-size: 0.72rem; color: var(--text-muted); margin-top: 2px;">
                  Ends: ${c.trial_ends_at ? new Date(c.trial_ends_at).toLocaleDateString() : '-'}
                </div>
              ` : `
                <div style="font-size: 0.82rem; font-weight: 700; color: #059669;">
                  Annual Paid License
                </div>
                <div style="font-size: 0.72rem; color: var(--text-muted); margin-top: 2px;">
                  Renews: ${c.expires_at ? new Date(c.expires_at).toLocaleDateString() : 'Active'}

              `}

            <td>
              <div style="font-weight: 800; color: #2563eb; font-size: 0.95rem;">
                🖥️ ${c.max_servers} Server${c.max_servers === 1 ? '' : 's'} Given
              </div>
              <div style="font-size: 0.72rem; color: var(--text-muted); margin-top: 2px;">
                ${c.active_servers} currently active in fleet
              </div>
              <div style="width: 100%; max-width: 130px; height: 5px; background: #e2e8f0; border-radius: 99px; margin-top: 5px; overflow: hidden;">
                <div style="width: ${Math.min(100, Math.round((c.active_servers / Math.max(1, c.max_servers)) * 100))}%; height: 100%; background: ${c.active_servers >= c.max_servers ? '#ef4444' : '#2563eb'}; border-radius: 99px;"></div>
              </div>
            </td>

            <!-- 6. Login Status -->
            <td>
              ${c.is_online ? `
                <div style="display: flex; align-items: center; gap: 6px;">
                  <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #10b981; box-shadow: 0 0 6px #10b981;"></span>
                  <strong style="color: #059669; font-size: 0.78rem;">Active Now</strong>
                </div>
                <div style="font-size: 0.7rem; color: var(--text-muted);">Online session</div>
              ` : c.has_logged_in ? `
                <div style="display: flex; align-items: center; gap: 5px;">
                  <span style="display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #059669;"></span>
                  <span style="font-size: 0.78rem; font-weight: 700; color: #334155;">Logged In</span>
                </div>
                <div style="font-size: 0.7rem; color: var(--text-muted); margin-top: 2px;">
                  ${c.last_login ? new Date(c.last_login).toLocaleDateString() : 'Verified session'}
                </div>
              ` : `
                <div style="font-size: 0.76rem; color: #94a3b8;">
                  ⚪ Never Logged In
                </div>
              `}
            </td>

            <!-- 7. Admin Controls -->
            <td style="text-align: right;">
              <div class="action-btn-group">
                ${c.status === 'trial' ? `
                  <button class="btn btn-outline btn-xs" onclick="AdminPortal.extendCustomerTrial(${c.id}, '${c.full_name.replace(/'/g, "\\'")}')" title="Add 7 extra days to trial">
                    <span>+7d Trial</span>
                  </button>
                ` : ''}
                <button class="btn btn-secondary btn-xs" onclick="AdminPortal.openUpgradeCustomerModal(${c.id}, '${c.full_name.replace(/'/g, "\\'")}', '${c.plan_id}')" title="Change subscription tier">
                  <span>Upgrade</span>
                </button>
                <button class="btn btn-primary btn-xs" onclick="AdminPortal.openServerQuotaModal(${c.id}, '${c.full_name.replace(/'/g, "\\'")}', ${c.max_servers})" title="Override how much servers you gave">
                  <span>Set Quota</span>
                </button>
                <button class="btn btn-outline btn-xs" onclick="AdminPortal.openResetPasswordModal(${c.id}, '${c.full_name.replace(/'/g, "\\'")}')" title="Reset password">
                  <span>🔑 Reset</span>
                </button>
                <button class="btn btn-xs" style="background: #fee2e2; color: #b91c1c; border-color: #fca5a5;" onclick="AdminPortal.deleteUser(${c.id}, '${c.full_name.replace(/'/g, "\\'")}')" title="Permanently delete user">
                  <span>🗑️ Delete</span>
                </button>
              </div>
            </td>
          </tr>
        `).join('');
      },

      // Filter Helpers for All Users
      getFilteredUsers() {
        const query = (this.state.userSearch || '').trim().toLowerCase();
        const filter = this.state.userFilter || 'all';

        return this.state.allUsers.filter(u => {
          if (filter === 'customer' && u.role !== 'customer') return false;
          if (filter === 'admin' && u.role !== 'superadmin' && u.role !== 'admin') return false;
          if (filter === 'logged_in' && !u.has_logged_in) return false;

          if (query) {
            const matchName = (u.full_name || '').toLowerCase().includes(query);
            const matchUser = (u.username || '').toLowerCase().includes(query);
            const matchEmail = (u.email || '').toLowerCase().includes(query);
            const matchRole = (u.role || '').toLowerCase().includes(query);
            const matchCompany = (u.company || '').toLowerCase().includes(query);
            if (!matchName && !matchUser && !matchEmail && !matchRole && !matchCompany) {
              return false;
            }
          }
          return true;
        });
      },

      filterUsers(query) {
        this.state.userSearch = query;
        const tbody = document.getElementById('userTableBody');
        const countBadge = document.getElementById('userCountBadge');
        const clearBtn = document.getElementById('userClearSearchBtn');
        if (clearBtn) {
          clearBtn.style.display = query ? 'flex' : 'none';
        }
        if (tbody) {
          const filtered = this.getFilteredUsers();
          tbody.innerHTML = this.renderUserRows(filtered);
          if (countBadge) countBadge.textContent = `${filtered.length} of ${this.state.allUsers.length}`;
        }
      },

      setUserFilter(filter) {
        this.state.userFilter = filter;
        document.getElementById('tabContentArea').innerHTML = this.renderActiveTab();
      },

      clearUserSearch() {
        this.state.userSearch = '';
        const input = document.getElementById('userSearchInput');
        if (input) input.value = '';
        this.filterUsers('');
      },

      // TAB 3: All Registered Users & Credentials
      renderUsersTab() {
        const users = this.state.allUsers;
        const filtered = this.getFilteredUsers();
        const customerCount = users.filter(u => u.role === 'customer').length;
        const adminCount = users.filter(u => u.role === 'superadmin' || u.role === 'admin').length;
        const loggedInCount = users.filter(u => u.has_logged_in).length;

        return `
          <div class="card">
            <div class="card-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
              <div>
                <h3 class="card-title" style="display: flex; align-items: center; gap: 8px;">
                  <span>🛡️ All System Accounts</span>
                  <span class="badge badge-primary" id="userCountBadge">${filtered.length} of ${users.length}</span>
                </h3>
                <p style="font-size: 0.82rem; color: var(--text-muted); margin-top: 2px;">
                  Overview of all registered customer recruiters and platform super-administrators with login session monitoring
                </p>
              </div>
              <button class="btn btn-primary btn-sm" onclick="AdminPortal.openCreateUserModal()">+ Create User</button>
            </div>

            <!-- Search Bar & Filters for Users -->
            <div class="filter-card-bar">
              <!-- Live Search Input -->
              <div style="position: relative; flex: 1; min-width: 280px; max-width: 480px;">
                <span style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 1rem; color: #64748b; pointer-events: none;">🔍</span>
                <input type="text" id="userSearchInput" value="${this.state.userSearch}"

      renderUserRows(users) {
        if (!users || users.length === 0) {
          return `
            <tr>
              <td colspan="6" style="text-align:center; padding: 36px 16px; color: var(--text-muted);">
                <div style="font-size: 2rem; margin-bottom: 8px;">🔍</div>
                <div style="font-weight: 700; color: #1e293b; font-size: 1rem;">No matching accounts found</div>
                <p style="font-size: 0.82rem; margin-top: 4px;">Try searching for a different username, email, or role.</p>
                ${this.state.userSearch ? `
                  <button class="btn btn-secondary btn-xs" style="margin-top: 10px;" onclick="AdminPortal.clearUserSearch()">Clear Search</button>
                ` : ''}
              </td>
            </tr>
          `;
        }

        return users.map(u => `
          <tr>
            <td>
              <div style="display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 1.3rem;">${u.avatar || '👤'}</span>
                <div>
                  <div style="font-weight: 700; color: var(--text-primary);">${u.full_name || u.username}</div>
                  <div style="font-size: 0.74rem; color: var(--text-muted);">@${u.username}</div>
                  ${u.company ? `<div style="font-size: 0.72rem; color: #475569;">🏢 ${u.company}</div>` : ''}
                </div>
              </div>
            </td>
            <td>
              <code>${u.email}</code>
              ${u.phone ? `<div style="font-size: 0.72rem; color: #64748b; margin-top: 2px;">📞 ${u.phone}</div>` : ''}
            </td>
            <td>
              <span class="badge ${u.role === 'superadmin' ? 'badge-primary' : (u.role === 'admin' ? 'badge-info' : 'badge-secondary')}">
                ${u.role.toUpperCase()}
              </span>
            </td>
            <td>
              ${u.is_online ? `
                <div style="display: flex; align-items: center; gap: 6px;">
                  <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #10b981; box-shadow: 0 0 6px #10b981;"></span>
                  <strong style="color: #059669; font-size: 0.78rem;">Online Now</strong>
                </div>
              ` : u.has_logged_in ? `
                <div style="font-size: 0.78rem; font-weight: 600; color: #334155;">
                  🟢 Logged In
                </div>
                <div style="font-size: 0.7rem; color: var(--text-muted);">
                  ${u.last_login ? new Date(u.last_login).toLocaleDateString() : 'Verified session'}
                </div>
              ` : `
                <span style="font-size: 0.76rem; color: #94a3b8;">⚪ Never</span>
              `}
            </td>
            <td style="font-size: 0.78rem; color: var(--text-muted);">
              ${new Date(u.created_at).toLocaleDateString()}
            </td>
            <td style="text-align: right;">
              <div class="action-btn-group">
                <button class="btn btn-secondary btn-xs" onclick="AdminPortal.openResetPasswordModal(${u.id}, '${(u.full_name || u.username).replace(/'/g, "\\'")}')">
                  🔑 Password
                </button>
                ${u.id !== this.state.currentUser.id ? `
                  <button class="btn btn-xs" style="background: #fee2e2; color: #b91c1c; border-color: #fca5a5;" onclick="AdminPortal.deleteUser(${u.id}, '${(u.full_name || u.username).replace(/'/g, "\\'")}')">
                    🗑️ Delete
                  </button>
                ` : '<span style="font-size:0.7rem; color:var(--text-muted); padding:4px 8px;">Current Session</span>'}
              </div>
            </td>
          </tr>
        `).join('');
      },

                    </div>

                    <div style="background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 6px; padding: 8px 12px; margin-bottom: 14px; font-size: 0.82rem; font-weight: 700; color: #0369a1;">
                      🖥️ ${p.max_servers} Dedicated SMTP Server${p.max_servers === 1 ? '' : 's'}
                    </div>

                    <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px; line-height: 1.5;">

      async approvePayment(paymentId, customerName, planName) {
        if (!confirm(`Are you sure you want to APPROVE payment #${paymentId} for "${customerName}"?\n\nThis will immediately release customer access and unlock the ${planName} server quota.`)) {
          return;
        }

        try {
          const res = await api.approvePayment(paymentId);
          this.showToast(res.message || 'Payment approved and access released!', 'success');
          await this.loadData();
          this.renderDashboard();
        } catch (err) {
          this.showToast(err.message, 'error');
        }
      },

      async rejectPayment(paymentId, customerName) {
        const reason = prompt(`Enter rejection reason for "${customerName}":`, 'Payment reference / UTR could not be verified.');
        if (reason === null) return;

        try {
          const res = await api.rejectPayment(paymentId, reason);
          this.showToast(res.message || 'Payment marked as rejected.', 'info');
          await this.loadData();
          this.renderDashboard();
        } catch (err) {
          this.showToast(err.message, 'error');
        }
      },

      async deleteUser(userId, name) {
        if (!confirm(`⚠️ PERMANENT DELETE WARNING:\n\nAre you sure you want to permanently delete user "${name}" (ID: ${userId})?\n\nThis will permanently remove:\n- All candidate contacts\n- All campaign blast histories\n- All custom SMTP accounts\n- All subscriptions & payment records\n\nThis action CANNOT be undone.`)) {
          return;
        }

        try {
          const res = await api.deleteUser(userId);
          this.showToast(res.message || 'User deleted successfully.', 'success');
          await this.loadData();
          this.renderDashboard();
        } catch (err) {
          this.showToast(err.message, 'error');
        }
      },

      openEditPlanModal(planId) {
        const plan = this.state.plans.find(p => p.id === planId);
        if (!plan) return;

        const modalHtml = `
          <div class="modal-header">
            <h3 class="modal-title">💎 Edit Plan: ${plan.name}</h3>
            <button class="modal-close" onclick="AdminPortal.closeModal()">&times;</button>
          </div>
          <div class="modal-body">
            <form onsubmit="AdminPortal.handleSavePlan(event, '${planId}')">
              <div class="form-group" style="margin-bottom: 12px;">
                <label class="form-label" style="font-weight: 700;">Plan Title</label>
                <input type="text" id="editPlanName" class="form-input" value="${plan.name}" required />
              </div>

              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
                <div class="form-group">
                  <label class="form-label" style="font-weight: 700; color: #059669;">Price in INR (₹)</label>
                  <input type="number" id="editPlanPrice" class="form-input" value="${plan.price}" min="0" required />
                </div>
                <div class="form-group">
                  <label class="form-label" style="font-weight: 700; color: #2563eb;">Max Dedicated Servers</label>
                  <input type="number" id="editPlanServers" class="form-input" value="${plan.max_servers}" min="1" max="100" required />
                </div>
              </div>

              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
                <div class="form-group">
                  <label class="form-label" style="font-weight: 600;">Max Monthly Emails</label>
                  <input type="number" id="editPlanEmails" class="form-input" value="${plan.max_emails_per_month}" min="100" required />
                </div>
                <div class="form-group">
                  <label class="form-label" style="font-weight: 600;">Max Contacts</label>
                  <input type="number" id="editPlanContacts" class="form-input" value="${plan.max_contacts}" min="100" required />
                </div>
              </div>

              <div class="form-group" style="margin-bottom: 18px;">
                <label class="form-label" style="font-weight: 600;">Plan Description</label>
                <textarea id="editPlanDesc" class="form-input" rows="3">${plan.description || ''}</textarea>
              </div>

              <div style="display: flex; justify-content: flex-end; gap: 8px;">
                <button type="button" class="btn btn-secondary" onclick="AdminPortal.closeModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Plan Changes</button>
              </div>
            </form>
          </div>
        `;
        this.openModal(modalHtml);
      },

      async handleSavePlan(e, planId) {
        e.preventDefault();
        const name = document.getElementById('editPlanName').value.trim();
        const price = Number(document.getElementById('editPlanPrice').value);
        const max_servers = parseInt(document.getElementById('editPlanServers').value, 10);
        const max_emails_per_month = parseInt(document.getElementById('editPlanEmails').value, 10);
        const max_contacts = parseInt(document.getElementById('editPlanContacts').value, 10);
        const description = document.getElementById('editPlanDesc').value.trim();

        try {
          const res = await api.updateSubscriptionPlan(planId, {
            name,
            price,
            max_servers,
            max_emails_per_month,
            max_contacts,
            description
          });
          this.closeModal();
          this.showToast(res.message || 'Plan updated successfully!', 'success');
          await this.loadData();
          this.renderDashboard();
        } catch (err) {
          this.showToast(err.message, 'error');
        }
      },

            <h3 class="modal-title">🔑 Reset Password for ${name}</h3>
            <button class="modal-close" onclick="AdminPortal.closeModal()">&times;</button>

              <div class="form-group" style="margin-bottom: 18px;">

          this.showToast(err.message, 'error');

            <button class="modal-close" onclick="AdminPortal.closeModal()">&times;</button>

              ${plans.map(p => `
                <label class="card" style="padding: 12px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; border: 1.5px solid ${currentPlan === p.id ? '#2563eb' : 'var(--border-light)'};">
                  <input type="radio" name="planSelect" value="${p.id}" ${currentPlan === p.id ? 'checked' : ''} />

      async handleSaveCustomerPlan(customerId) {
        const selected = document.querySelector('input[name="planSelect"]:checked')?.value;
        if (!selected) return;

        try {
          const res = await api.upgradeCustomerPlan(customerId, selected);
          this.closeModal();
          this.showToast(res.message, 'success');
          await this.loadData();
          this.renderDashboard();
        } catch (err) {
          this.showToast(err.message, 'error');
        }
      },

      openServerQuotaModal(customerId, name, currentMax) {
        const content = `
          <div class="modal-header">
            <h3 class="modal-title">🖥️ Server Quota: How Much Server You Gave</h3>
            <button class="modal-close" onclick="AdminPortal.closeModal()">&times;</button>
          </div>
          <div class="modal-body">
            <p style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 16px;">
              Directly specify the maximum number of active SMTP senders given to <strong>${name}</strong>.
            </p>

            <form onsubmit="AdminPortal.handleSaveServerQuota(event, ${customerId})">
              <div class="form-group" style="margin-bottom: 16px;">
                <label class="form-label" style="font-weight: 700; color: #2563eb;">
                  How Much Servers Given:
                </label>
                <input type="number" id="overrideServersCount" class="form-input" min="1" max="100" value="${currentMax || 1}" required />
                <p style="font-size: 0.74rem; color: var(--text-muted); margin-top: 4px;">
                  During 7-day trial, default is 1 server. You can grant 2, 5, 10, or custom server fleets here.
                </p>
              </div>

              <div style="display: flex; justify-content: flex-end; gap: 8px;">
                <button type="button" class="btn btn-secondary" onclick="AdminPortal.closeModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Server Quota</button>
              </div>
            </form>
          </div>
        `;

        this.openModal(content);
      },

      async handleSaveServerQuota(e, customerId) {
        e.preventDefault();
        const maxServers = parseInt(document.getElementById('overrideServersCount').value, 10);

        try {
          const res = await api.updateCustomerLimits(customerId, { max_servers: maxServers });
          this.closeModal();
          this.showToast(res.message, 'success');
          await this.loadData();
          this.renderDashboard();
        } catch (err) {
          this.showToast(err.message, 'error');
        }
      },

      copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
        this.showToast(`Copied "${text}" to clipboard!`, 'success');
      },

      openModal(html) {
        const overlay = document.getElementById('modalContainer');
        const card = document.getElementById('modalCard');
        if (overlay && card) {
          card.innerHTML = html;
          overlay.style.display = 'flex';
          document.body.style.overflow = 'hidden';
        }
      },

      closeModal() {
        const overlay = document.getElementById('modalContainer');
        if (overlay) {
          overlay.style.display = 'none';
          document.body.style.overflow = '';
        }
      },

      showToast(msg, type = 'info') {
        const container = document.getElementById('toastContainer');
        if (!container) return;
        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;
        toast.innerHTML = `<div class="toast-content"><div class="toast-msg">${msg}</div></div>`;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 4000);
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      AdminPortal.init();
    });
  </script>
</body>
</html>
